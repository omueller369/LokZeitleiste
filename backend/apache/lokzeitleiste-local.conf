# Beispiel für Apache 2.4 auf dem Entwicklungsrechner.
# Wenn Port 8080 bereits lauscht, Listen-Zeile an die globale ports.conf anpassen.
Listen 127.0.0.1:8080
<VirtualHost 127.0.0.1:8080>
    ServerName localhost
    ProxyRequests Off
    ProxyPass "/" "http://127.0.0.1:8000/"
    ProxyPassReverse "/" "http://127.0.0.1:8000/"
</VirtualHost>
