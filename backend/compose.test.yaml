# Eigenständiger Teststack; nicht mit compose.yaml kombinieren.
name: lokzeitleiste-test
x-app: &app
  build: .
  restart: unless-stopped
  environment: &env
    DATABASE_URL: mysql+pymysql://lokzeitleiste:${MYSQL_PASSWORD:?prepare.sh ausführen}@db:3306/lokzeitleiste?charset=utf8mb4
    MAILBOX_IMAP_HOST: ${MAILBOX_IMAP_HOST:-}
    MAILBOX_IMAP_PORT: ${MAILBOX_IMAP_PORT:-993}
    MAILBOX_SMTP_HOST: ${MAILBOX_SMTP_HOST:-}
    MAILBOX_SMTP_PORT: ${MAILBOX_SMTP_PORT:-465}
    MAILBOX_SMTP_SECURITY: ${MAILBOX_SMTP_SECURITY:-ssl}
    MAILBOX_SENT_FOLDER: ${MAILBOX_SENT_FOLDER:-Sent}
    MAILBOX_ENCRYPTION_KEY: ${MAILBOX_ENCRYPTION_KEY:-}
    MAILBOX_MICROSOFT_CLIENT_ID: ${MAILBOX_MICROSOFT_CLIENT_ID:-}
    MAILBOX_MICROSOFT_TENANT: ${MAILBOX_MICROSOFT_TENANT:-common}
    MAILBOX_GOOGLE_CLIENT_ID: ${MAILBOX_GOOGLE_CLIENT_ID:-}
    MAILBOX_GOOGLE_CLIENT_SECRET: ${MAILBOX_GOOGLE_CLIENT_SECRET:-}
    PUBLIC_ORIGIN: http://localhost:8080
    COOKIE_SECURE: "false"
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_SECURITY: starttls
    SMTP_FROM: lokzeitleiste@example.com
    SSL_CERT_FILE: /test-certs/mailpit.crt
  volumes:
    - ./testenv/certs/mailpit.crt:/test-certs/mailpit.crt:ro
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lokzeitleiste
      MYSQL_USER: lokzeitleiste
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?prepare.sh ausführen}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?prepare.sh ausführen}
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_TLS_CERT: /certs/mailpit.crt
      MP_SMTP_TLS_KEY: /certs/mailpit.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
    volumes:
      - mailpit_test_data:/data
      - ./testenv/certs:/certs:ro
    ports:
      - "127.0.0.1:8025:8025"
  api:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  mailer:
    <<: *app
    command: [python, -m, lokzeitleiste.reports.worker]
    depends_on:
      api:
        condition: service_healthy
      mailpit:
        condition: service_started
volumes:
  mysql_test_data:
  mailpit_test_data:
