<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triebfahrzeuge · LokZeitleiste</title><link rel="stylesheet" href="/admin/portal.css"><link rel="stylesheet" href="/responsive.css"><script src="/i18n.js" defer></script><style>
.headerline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.vehicle-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.vehicle-grid label{display:block}.vehicle-grid input,.vehicle-grid select,.vehicle-grid textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px;border:1px solid #b6cbd6;border-radius:7px;margin-top:5px}.vehicle-wide{grid-column:1/-1}.vehicle-number{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.vehicle-number input{width:3.6em}.vehicle-number input[data-length="4"]{width:5.3em}.vehicle-number input[data-length="3"]{width:4.5em}.vehicle-number input[data-length="1"]{width:2.8em}.vehicle-status{display:inline-block;padding:7px 10px;border-radius:7px;color:#193044;font-weight:700}.vehicle-table button{min-height:44px}.vehicle-table th,.vehicle-table td{padding:10px;text-align:left;border-bottom:1px solid #d6e1e7}.vehicle-table{width:100%;border-collapse:collapse}fieldset{border:0;padding:0;margin:0}fieldset:disabled{opacity:1}input:disabled,textarea:disabled,select:disabled{color:#193044;opacity:1}#vehicleMessage{white-space:pre-wrap}#vehicleForm .toolbar{margin-top:18px}@media(max-width:650px){.vehicle-grid{grid-template-columns:1fr}.vehicle-wide{grid-column:auto}}
</style></head><body><header><h1>Triebfahrzeuge</h1><a href="/admin">Zur Verwaltung</a></header><main><p id="vehicleMessage" role="status" aria-live="polite"></p>
<section class="card"><h2>Triebfahrzeugübersicht</h2><div class="toolbar"><label>Suche<input id="vehicleSearch" type="search" maxlength="200" placeholder="Fahrzeugnummer, Baureihe, Name oder Leasing-Geber"></label><label>Status<select id="vehicleFilter"><option value="">Alle</option><option value="ready">Einsatzbereit</option><option value="unavailable">Nicht einsatzbereit</option><option value="limited">Eingeschränkt einsatzbereit</option></select></label><button id="vehicleReload" type="button">Aktualisieren</button><button id="vehicleNew" type="button" hidden>Triebfahrzeug hinzufügen</button></div><p id="vehicleEmpty" hidden>Keine Triebfahrzeuge vorhanden.</p><div class="tablewrap"><table class="vehicle-table"><thead><tr><th>Fahrzeugnummer</th><th>Baureihe</th><th>Name</th><th>Status</th><th>Nächste Revision</th><th>Aktionen</th></tr></thead><tbody id="vehicleRows"></tbody></table></div></section>
<section class="card" id="vehicleEditor" hidden><div class="headerline"><h2 id="vehicleTitle">Triebfahrzeug</h2><span id="vehicleStatusBadge" class="vehicle-status"></span><button id="vehicleEdit" type="button" hidden>Bearbeiten</button></div><form id="vehicleForm"><fieldset id="vehicleFields"><div class="vehicle-grid">
<label>Status<select id="vehicleStatus"><option value="ready">Einsatzbereit</option><option value="unavailable">Nicht einsatzbereit</option><option value="limited">Eingeschränkt einsatzbereit</option></select></label><label id="vehicleStatusNoteBox" hidden><span id="vehicleStatusNoteLabel">Grund</span><textarea id="vehicleStatusNote" rows="2" maxlength="1024"></textarea></label>
<label>Baureihe<input id="vehicleSeries" maxlength="120"></label><div><label>Fahrzeugnummer</label><div class="vehicle-number" role="group" aria-label="Fahrzeugnummer"><input id="vehicleNumber1" data-length="2" inputmode="numeric" pattern="[0-9]{2}" maxlength="2" aria-label="Fahrzeugnummer: erste 2 Ziffern" required><input id="vehicleNumber2" data-length="2" inputmode="numeric" pattern="[0-9]{2}" maxlength="2" aria-label="Fahrzeugnummer: zweite 2 Ziffern" required><input id="vehicleNumber3" data-length="4" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" aria-label="Fahrzeugnummer: 4 Ziffern" required><input id="vehicleNumber4" data-length="3" inputmode="numeric" pattern="[0-9]{3}" maxlength="3" aria-label="Fahrzeugnummer: 3 Ziffern" required><span>-</span><input id="vehicleNumber5" data-length="1" inputmode="numeric" pattern="[0-9]" maxlength="1" aria-label="Fahrzeugnummer: letzte Ziffer" required></div></div>
<label>Leasing-Geber<input id="vehicleLessor" maxlength="200"></label><label>Hotlinetelefon-Nr.<input id="vehicleHotline" type="tel" maxlength="60"></label><label>Name<input id="vehicleName" maxlength="120"></label><label>Leistung (kW)<input id="vehiclePower" maxlength="40"></label>
<h3 class="vehicle-wide">Bremsgewichte</h3><label>Stellung R<input id="vehicleBrakeR" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" value="0" required></label><label>Stellung P<input id="vehicleBrakeP" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" value="0" required></label><label>Stellung G<input id="vehicleBrakeG" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" value="0" required></label><label>G−25 % (automatisch)<input id="vehicleBrakeG25" value="0" readonly aria-readonly="true"></label><label>Federspeicher<input id="vehicleSpring" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" value="0" required></label><label>Einheit Federspeicher<select id="vehicleSpringUnit"><option value="t">t</option><option value="kN">kN</option></select></label>
<label>Nächste Revision<input id="vehicleRevisionDate" type="date"></label><label>Letzter Kilometerstand<input id="vehicleMileage" inputmode="numeric" pattern="[0-9]{1,7}" maxlength="7" value="0" required></label><label class="vehicle-wide">Hinweistext<textarea id="vehicleNotes" rows="5" maxlength="4096"></textarea></label></div></fieldset><div class="toolbar"><button id="vehicleSave" type="submit" hidden>Speichern</button><button id="vehicleCancel" type="button" hidden>Abbrechen</button></div></form></section>
</main><script src="/admin/vehicles.js?v=20261022-1"></script><script src="/admin/backend-nav.js"></script></body></html>
