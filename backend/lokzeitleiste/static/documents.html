<!doctype html><html lang="de"><head><script src="/auth-session.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dokumente · LokZeitleiste</title><link rel="stylesheet" href="/tf/portal.css"><link rel="stylesheet" href="/documents.css"><script src="/i18n.js" defer></script></head><body>
<header><a class="brand" id="documentHome" href="/account">LokZeitleiste</a><h1>Meine Dokumente</h1><a href="/account">Mein Konto / Passwort</a></header>
<main><p id="documentIdentity" data-i18n-ignore></p><p id="documentMessage" role="status" aria-live="polite"></p>
<section class="card document-controls"><label>Dokumente durchsuchen<input id="documentSearch" type="search" maxlength="200" placeholder="Dateiname oder Ordner"></label><button id="documentRefresh" type="button">Aktualisieren</button></section>
<div class="document-layout"><aside class="card"><h2>Verzeichnisse</h2><div class="document-tree" id="documentTree"></div></aside>
<section class="card document-files"><h2 id="documentFolder" data-i18n-ignore>Dokumente</h2><form id="documentUpload"><label>Dokument hochladen (max. 10 MB)<input id="documentFile" type="file" required></label><button id="documentUploadButton">Hochladen</button></form><p>Automatisch erstellte Dokumente können nicht gelöscht werden.</p><p id="documentEmpty" hidden>Keine Dokumente vorhanden.</p><div id="documentFiles"></div></section></div></main><script src="/documents.js"></script></body></html>
