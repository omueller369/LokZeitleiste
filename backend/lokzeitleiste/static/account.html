<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LokZeitleiste · Passwort ändern</title><style>
*{box-sizing:border-box}body{background:#eef3f5;color:#193044;font:16px system-ui,sans-serif;margin:0}main{max-width:520px;margin:8vh auto;padding:24px}section{background:white;padding:28px;border-radius:14px;border:1px solid #d8e2e8}label{display:block;margin:16px 0;font-weight:600}input{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #becdd7;border-radius:8px;font:inherit}button{background:#17445b;color:white;padding:12px 18px;border:0;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.5}.error{color:#a33129}.ok{color:#28734e}a{color:#17445b}[hidden]{display:none!important}
</style></head><body><main><section><h1>Passwort ändern</h1><p id="message" role="status"></p>
<form id="loginForm" hidden><h2>Anmelden</h2><label>Benutzername<input name="username" required minlength="3" autocomplete="username"></label><label>Passwort<input name="password" type="password" required autocomplete="current-password"></label><button>Anmelden</button></form>
<form id="passwordForm" hidden><p id="identity"></p><p id="mandatory" hidden>Vor dem Zugriff auf Ihre Module müssen Sie Ihr Initialpasswort durch ein eigenes Passwort ersetzen.</p><label>Aktuelles Passwort<input name="current_password" type="password" required autocomplete="current-password"></label><label>Neues Passwort (mindestens 12 Zeichen)<input name="new_password" type="password" required minlength="12" maxlength="4096" autocomplete="new-password"></label><label>Neues Passwort wiederholen<input name="confirm_password" type="password" required minlength="12" maxlength="4096" autocomplete="new-password"></label><button>Passwort ändern</button></form>
<p><a id="back" href="/admin">Zur Verwaltung</a> <button id="logout" hidden>Abmelden</button></p></section></main><script src="/account.js"></script></body></html>
