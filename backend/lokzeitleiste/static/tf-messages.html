<!doctype html><html lang="de"><head><script src="/auth-session.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nachrichten · TF-Portal</title><link rel="stylesheet" href="/admin/portal.css"><link rel="stylesheet" href="/responsive.css"><link rel="stylesheet" href="/tf/shell.css?v=20261026-1"><link rel="stylesheet" href="/tf/work-report.css?v=20261026-1"><script src="/i18n.js" defer></script></head><body><header><h1>TF-Portal</h1></header><main><h1>Nachrichten</h1><p id="messagesStatus" role="status" aria-live="polite"></p><section class="card"><div class="toolbar"><button id="messageNew" type="button">neue Nachricht schreiben</button><button id="messagesReload" type="button">Aktualisieren</button></div><p id="messagesEmpty" hidden>Keine Nachrichten vorhanden.</p><div class="tablewrap"><table class="tf-message-table"><thead><tr><th>Status</th><th>Von</th><th>Betreff</th><th>Datum / Uhrzeit</th><th>Aktionen</th></tr></thead><tbody id="messagesRows"></tbody></table></div><div class="toolbar"><button id="messagesPrevious" type="button">Zurück</button><span id="messagesPage" data-i18n-ignore></span><button id="messagesNext" type="button">Weiter</button></div></section></main>
<dialog id="messageCompose" class="tf-message-dialog" aria-labelledby="messageComposeTitle"><h2 id="messageComposeTitle">Neue Nachricht</h2><form id="messageComposeForm"><label>Empfänger (TF)<select id="messageRecipients" multiple size="8" required aria-describedby="messageMultiHint"></select></label><p id="messageMultiHint">Mehrfachauswahl möglich.</p><label>Betreff<input id="messageSubject" maxlength="200" required></label><label>Nachricht <span id="messageRemaining" data-i18n-ignore>1000/1000</span><textarea id="messageBody" maxlength="1000" rows="7" required></textarea></label><label>Dateianhang (max. 10 MB)<input id="messageFile" type="file"></label><div class="toolbar"><button id="messageSend" type="submit">Senden</button><button id="messageCancel" type="button">Abbrechen</button></div></form></dialog>
<dialog id="messageReader" class="tf-message-dialog" aria-labelledby="messageReadSubject"><div class="tf-message-tools"><h2 id="messageReadSubject" data-i18n-ignore></h2><button id="messageReadClose" type="button" aria-label="Schließen">X</button></div><p id="messageReadFrom" data-i18n-ignore></p><p id="messageReadDate" data-i18n-ignore></p><p id="messageReadBody" class="tf-message-body" data-i18n-ignore></p><div id="messagePreview" class="tf-message-preview"></div><div class="toolbar"><button id="messageDelete" type="button">Löschen</button><button id="messageForward" type="button">Weiterleiten</button></div></dialog>
<dialog id="messageForwardDialog" class="tf-message-dialog" aria-labelledby="messageForwardTitle"><div class="tf-message-tools"><h2 id="messageForwardTitle">Nachricht weiterleiten</h2><button id="messageForwardClose" type="button" aria-label="Abbrechen">X</button></div><form id="messageForwardForm"><label>Empfänger (TF)<select id="messageForwardRecipients" multiple size="8" required></select></label><p>Mehrfachauswahl möglich.</p><button id="messageForwardSend" type="submit">Senden</button></form></dialog>
<script src="/tf/work-report-feedback.js?v=20261026-1"></script><script src="/tf/messages.js?v=20261026-1"></script></body></html>
