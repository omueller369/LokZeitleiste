<!doctype html><html lang="de"><head><script src="/auth-session.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mitarbeiter E-Mail</title><link rel="stylesheet" href="/admin/portal.css"><link rel="stylesheet" href="/responsive.css"><script src="/i18n.js" defer></script><style>tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#edf4f8}.mail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}input,textarea{width:100%;box-sizing:border-box}textarea{min-height:180px}</style></head><body><header><h1>E-Mail</h1><a href="/admin/start">Zur Verwaltung</a></header><main><p id="message" role="status"></p><section class="card"><h2>Alle Mitarbeiter</h2><label>Suche<input id="search" type="search"></label><div class="tablewrap"><table><thead><tr><th>Vorname</th><th>Name</th><th>Rolle</th><th>E-Mail-Adresse</th><th>Postfach</th></tr></thead><tbody id="employees"></tbody></table></div></section><section class="card" id="editor" hidden><h2>E-Mail verfassen</h2><form id="mailForm"><p>Absender: <strong id="sender"></strong></p><div class="mail-grid"><label>An<input name="to" required placeholder="name@domain.de"></label><label>CC<input name="cc"></label><label>BCC<input name="bcc"></label></div><label>Betreff<input name="subject" maxlength="300" required></label><label>Nachricht<textarea name="body" maxlength="200000" required></textarea></label><label>Dateianhänge (zusammen maximal 7 MiB)<input name="attachments" type="file" multiple></label><button id="send">Senden</button> <button type="button" id="cancel">Abbrechen</button></form></section></main><script src="/admin/portal-ui.js"></script><script src="/admin/email.js"></script><script src="/admin/backend-nav.js"></script></body></html>
