<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LokZeitleiste · Administration</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#193044;font:15px system-ui,sans-serif}
header{background:#132c40;color:white;padding:18px max(24px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center}
main{max-width:1200px;margin:30px auto;padding:0 20px}h1{margin:0;font-size:24px}h2{font-size:20px;margin-top:0}
.grid{display:grid;grid-template-columns:380px 1fr;gap:22px}.card{background:white;border:1px solid #d8e2e8;border-radius:14px;padding:24px;box-shadow:0 3px 12px #16395312}
label{display:block;font-weight:650;font-size:13px;margin:12px 0 4px}input,select{padding:11px;border:1px solid #becdd7;border-radius:8px;width:100%;font:inherit}
button{cursor:pointer;background:#17445b;color:white;border:0;border-radius:8px;padding:11px 17px;font:inherit;font-weight:650}button.secondary{background:#e5edf1;color:#1c4b60}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e9ee}th{font-size:12px;color:#526879}
.muted{color:#667b89;font-size:13px}.error{color:#a33129}.ok{color:#28734e}#login{max-width:420px;margin:10vh auto}
@media(max-width:850px){.grid{grid-template-columns:1fr}table{display:block;overflow-x:auto}}
</style><link rel="stylesheet" href="/responsive.css"><script src="/i18n.js" defer></script></head><body><header><h1>LokZeitleiste · Administration</h1><button id="logout" class="secondary" hidden>Abmelden</button></header>
<main><section id="login" class="card"><h2>Admin-Anmeldung</h2><form id="loginForm"><label>Benutzername<input name="username" required autocomplete="username"></label><label>Passwort<input name="password" type="password" required autocomplete="current-password"></label><p id="loginMessage" class="error"></p><button>Anmelden</button></form></section>
<section id="dashboard" hidden><nav id="navigation" class="card"></nav><div class="grid"><div id="createTfCard" class="card"><h2>Tf anlegen</h2><p class="muted">Konten werden durch Admins angelegt. Das Passwort wird nur bei dieser Eingabe verwendet.</p>
<form id="tfForm"><div class="two"><label>Vorname<input name="first_name" required></label><label>Name<input name="last_name" required></label></div>
<div class="two"><label>Personalnummer<input name="personnel_number" required></label><label>Benutzername<input name="username" required minlength="3"></label></div>
<label>Passwort (mindestens 12 Zeichen)<input name="password" type="password" required minlength="12" autocomplete="new-password"></label>
<div class="two"><label>Sollstunden (monatlich)<input name="target_hours" type="number" min="0" max="744" step="0.5" required></label><label>Urlaubstage<input name="vacation_days" type="number" min="0" max="366" required></label></div>
<div class="two"><label>Geburtsdatum<input name="birth_date" type="date" required></label><label>BahnCard<select name="bahncard"><option value="50">50</option><option value="100">100</option></select></label></div>
<div class="two"><label>E-Mail des Tf<input name="email" type="email" required autocomplete="email"></label><label>Bundesland<select name="federal_state" required><option value="">Bitte wählen</option><option value="BW">Baden-Württemberg</option><option value="BY">Bayern</option><option value="BE">Berlin</option><option value="BB">Brandenburg</option><option value="HB">Bremen</option><option value="HH">Hamburg</option><option value="HE">Hessen</option><option value="MV">Mecklenburg-Vorpommern</option><option value="NI">Niedersachsen</option><option value="NW">Nordrhein-Westfalen</option><option value="RP">Rheinland-Pfalz</option><option value="SL">Saarland</option><option value="SN">Sachsen</option><option value="ST">Sachsen-Anhalt</option><option value="SH">Schleswig-Holstein</option><option value="TH">Thüringen</option></select></label></div>
<label>TF-Typ<select name="driver_type"><option value="route">Strecken-TF</option><option value="border">Grenz-TF</option><option value="both">Grenz- und Strecken-TF</option></select></label><div id="tfPhotoSelection" class="photo-editor"></div><p id="tfMessage"></p><button>Tf anlegen</button></form></div>
<div id="employeeCard" class="card"><h2>Tf-Übersicht</h2><label>TF-Typ<select id="tfTypeFilter"><option value="">Alle</option><option value="border">Grenz-TF</option><option value="route">Strecken-TF</option><option value="both">Grenz- und Strecken-TF</option></select></label><table><thead><tr><th>Name</th><th>Personalnr.</th><th>Benutzername</th><th>TF-Typ</th><th>E-Mail-Adresse</th><th>Aktionen</th></tr></thead><tbody id="users"></tbody></table>
<div id="months" class="muted" style="margin-top:22px">Wähle einen Tf für die Monatsdaten.</div></div></div></section></main>
<script src="/admin/photo-ui.js"></script><script src="/admin/admin.js"></script></body></html>
