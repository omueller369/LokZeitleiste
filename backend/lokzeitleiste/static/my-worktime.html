<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meine Arbeitszeiten</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f5;color:#193044;font:15px system-ui,sans-serif}header{background:#132c40;color:white;padding:22px;display:flex;justify-content:space-between}header a{color:white}h1{font-size:24px;margin:0}main{max-width:1200px;margin:24px auto;padding:20px}.card{background:white;border:1px solid #d8e2e8;border-radius:12px;padding:22px;margin:18px 0}label{font-weight:650;display:block;font-size:13px}input,select,textarea{display:block;font:inherit;padding:10px;border:1px solid #becdd7;border-radius:7px;margin-top:5px}input[type=checkbox]{display:inline}button{font:inherit;background:#17445b;color:white;border:0;border-radius:7px;padding:11px 16px;cursor:pointer}.controls{display:flex;gap:15px;align-items:end;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e2e9ee;text-align:left;white-space:nowrap}.metrics{display:flex;gap:25px;flex-wrap:wrap}.metrics strong{display:block;font-size:25px}.muted{color:#667b89}.error{color:#a33129}dialog{width:min(450px,90vw);border:0;border-radius:12px;padding:22px}dialog label{margin:14px 0}dialog input,dialog textarea{width:100%}[hidden]{display:none!important}
</style><link rel="stylesheet" href="/responsive.css"><script src="/i18n.js" defer></script></head><body><header><h1>Meine Arbeitszeiten</h1><a href="/account">Mein Konto / Passwort</a><a id="adminLink" href="/admin" hidden>Verwaltung</a></header><main><p id="message" role="status"></p><div id="content" hidden><section class="card controls"><label>Jahr<input id="year" type="number" min="2000" max="2100"></label><label>Monat<select id="month"></select></label><button id="load">Laden</button></section><section class="card"><h2 id="title"></h2><div id="metrics" class="metrics"></div></section><section class="card" id="manual"></section>
<section class="card"><h2>Meine Einträge</h2><div class="scroll"><table><thead><tr><th>Datum</th><th>Art</th><th>Beginn</th><th>Ende</th><th>Enddatum</th><th>Pause</th><th>Gastfahrt</th><th>Status / Aktion</th></tr></thead><tbody id="entries"></tbody></table></div></section>
<section class="card"><h2>Tagesarbeitszeit</h2><div class="scroll"><table><thead><tr><th>Datum</th><th>Arbeitszeit</th><th>Gutschrift</th></tr></thead><tbody id="days"></tbody></table></div></section>
<section class="card"><h2>Wochenarbeitszeit</h2><div class="scroll"><table><thead><tr><th>KW</th><th>Von</th><th>Bis</th><th>Arbeitszeit</th><th>Gutschrift</th></tr></thead><tbody id="weeks"></tbody></table></div></section></div>
<dialog id="editDialog"><form id="editForm"><h2>Zeiten bearbeiten</h2><label>Beginn<input id="start" type="time" required></label><label>Ende<input id="end" type="time" required></label><label>Datum Arbeitsende<input id="editEndDate" type="date" required></label><label>Änderungsgrund<textarea id="reason" required maxlength="1000"></textarea></label><p id="editMessage" role="alert"></p><button>Speichern</button> <button id="cancel" type="button">Abbrechen</button></form></dialog>
</main><script src="/entry-form.js"></script><script src="/my/worktime.js"></script><script src="/admin/backend-nav.js"></script></body></html>
