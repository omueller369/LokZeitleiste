name: Android TF Portal APK
on:
  push:
    branches: ['setup/debian-testumgebung']
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'backend/lokzeitleiste/static/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'backend/lokzeitleiste/static/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Shared portal adapter tests
        run: |
          node backend/tests/test_android_portal.cjs
          node backend/tests/test_gps_browser.cjs
          node backend/tests/test_gps_android.cjs
      - name: Unit tests and APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug -PlokzeitleisteApiBaseUrl=https://ctl-software.io-goerlitz.eu
      - uses: actions/upload-artifact@v4
        with:
          name: LokZeitleiste-TF-Portal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
