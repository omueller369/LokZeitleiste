name: Android TF Portal APK
on:
  push:
    branches: ['setup/debian-testumgebung']
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'backend/lokzeitleiste/static/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'backend/lokzeitleiste/static/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Shared portal adapter tests
        run: |
          node backend/tests/test_android_portal.cjs
          node backend/tests/test_gps_browser.cjs
          node backend/tests/test_gps_android.cjs
      - name: Prepare stable test signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/tf-portal.jks"
            echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
            test -n "$ANDROID_KEYSTORE_PASSWORD"
            test -n "$ANDROID_KEY_ALIAS"
            test -n "$ANDROID_KEY_PASSWORD"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            chmod 600 "$ANDROID_KEYSTORE_PATH"
            echo 'HAS_ANDROID_KEYSTORE=true' >> "$GITHUB_ENV"
          fi
      - name: Unit tests and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug \
            -PlokzeitleisteApiBaseUrl=https://ctl-software.io-goerlitz.eu \
            -PlokzeitleisteVersionCode=$((100000 + GITHUB_RUN_NUMBER)) \
            -PlokzeitleisteVersionName=0.11-test.$GITHUB_RUN_NUMBER
      - uses: actions/upload-artifact@v4
        with:
          name: LokZeitleiste-TF-Portal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish signed tablet test update
        if: github.ref == 'refs/heads/setup/debian-testumgebung' && github.event_name != 'pull_request' && env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p update-release
          cp app/build/outputs/apk/debug/app-debug.apk update-release/LokZeitleiste-TF-Portal.apk
          python - <<'PYUPDATE'
          import hashlib, json, os, pathlib
          apk=pathlib.Path('update-release/LokZeitleiste-TF-Portal.apk')
          metadata={'application_id':'de.lokzeitleiste.app','version_code':100000+int(os.environ['GITHUB_RUN_NUMBER']),'version_name':'0.11-test.'+os.environ['GITHUB_RUN_NUMBER'],'sha256':hashlib.sha256(apk.read_bytes()).hexdigest()}
          pathlib.Path('update-release/update.json').write_text(json.dumps(metadata,indent=2)+'\n')
          PYUPDATE
          gh release create "android-test-$GITHUB_RUN_NUMBER" \
            update-release/LokZeitleiste-TF-Portal.apk update-release/update.json \
            --prerelease --target "$GITHUB_SHA" --title "TF Portal Android 0.11 Test $GITHUB_RUN_NUMBER" \
            --notes "Automatisch geprüfte Tablet-Testversion. Installation und Updates erfordern denselben Signierschlüssel und die Android-Bestätigung."
