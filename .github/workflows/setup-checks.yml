name: Ubuntu and Debian setup checks
on:
  push:
    paths: ['setup/**', 'backend/**', '.github/workflows/setup-checks.yml']
  pull_request:
    paths: ['setup/**', 'backend/**', '.github/workflows/setup-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bash and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          for script in setup/*.sh setup/tests/*.sh backend/testenv/prepare.sh backend/testenv/control.sh; do bash -n "$script"; done
          shellcheck -x setup/*.sh setup/tests/*.sh backend/testenv/prepare.sh backend/testenv/control.sh
          bash setup/install-ubuntu.sh --help
          bash setup/tests/test-platform.sh
          node --check backend/lokzeitleiste/static/planning.js
      - name: Compose configuration
        working-directory: backend
        run: |
          bash testenv/prepare.sh
          docker compose --env-file .env.test -f compose.test.yaml config --quiet
      - name: Backend and admin bootstrap tests
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
