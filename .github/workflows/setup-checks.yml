name: Ubuntu and Debian setup checks
on:
  push:
    paths: ['setup.sh', 'setup/**', 'backend/**', '.github/workflows/setup-checks.yml']
  pull_request:
    paths: ['setup.sh', 'setup/**', 'backend/**', '.github/workflows/setup-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bash and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          for script in setup.sh setup/*.sh setup/tests/*.sh backend/testenv/prepare.sh backend/testenv/control.sh; do bash -n "$script"; done
          shellcheck -x setup.sh setup/*.sh setup/tests/*.sh backend/testenv/prepare.sh backend/testenv/control.sh
          bash setup/install-ubuntu.sh --help
          bash setup/tests/test-platform.sh
          bash setup/tests/test-auto-admin.sh
          for script in backend/lokzeitleiste/static/*.js; do node --check "$script"; done
      - name: JavaScript regression tests
        run: for test in backend/tests/*.cjs; do node "$test" || exit 1; done
      - name: Responsive work report layout
        run: python backend/tests/check_work_report_layout.py --output-dir "$RUNNER_TEMP/work-report-layout"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-report-layout
          path: ${{ runner.temp }}/work-report-layout/
      - name: Backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Help overlay and print checks
        run: python backend/tests/check_tf_help_ui.py --output-dir "$RUNNER_TEMP/tf-help-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tf-help-ui
          path: ${{ runner.temp }}/tf-help-ui/
      - name: Notes UI checks
        run: python backend/tests/check_tf_notes_ui.py --output-dir "$RUNNER_TEMP/tf-notes-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tf-notes-ui
          path: ${{ runner.temp }}/tf-notes-ui/
      - name: Day and night mode browser checks
        run: python backend/tests/check_portal_theme_ui.py --output-dir "$RUNNER_TEMP/portal-theme-ui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-theme-ui
          path: ${{ runner.temp }}/portal-theme-ui/
      - name: Compose configuration
        working-directory: backend
        run: |
          bash testenv/prepare.sh
          docker compose --env-file .env.test -f compose.test.yaml config --quiet
      - name: Backend and admin bootstrap tests
        working-directory: backend
        run: |
          python -m unittest discover -s tests -v
